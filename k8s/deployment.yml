apiVersion: apps/v1
kind: Deployment

metadata:
  name: job-queue

spec:
  replicas: 4

  selector:
    matchLabels:
      app: job-queue

  template:
    metadata:
      labels:
        app: job-queue

    spec:
      containers:
        - name: job-queue

          image: abhishek260905/distributed-job-queue:1.4

          ports:
            - containerPort: 8080

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"